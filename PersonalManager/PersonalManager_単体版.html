function deleteItem(kind,id){if(!confirm('この項目を削除しますか？'))return;if(kind==='todo')d.todos=d.todos.filter(x=>x.id!==id);if(kind==='routine'){d.routines=d.routines.filter(x=>x.id!==id);d.completions=d.completions.filter(x=>x.routineId!==id)}if(kind==='event')d.events=d.events.filter(x=>x.id!==id);if(kind==='memo')d.memos=d.memos.filter(x=>x.id!==id);if(kind==='category'){if(d.categories.length<2)return alert('カテゴリは1つ以上必要です');const next=d.categories.find(x=>x.id!==id).id;d.categories=d.categories.filter(x=>x.id!==id);for(let list of [d.todos,d.routines,d.events,d.memos])for(let x of list)if(x.categoryId===id)x.categoryId=next;}modal=null;persist()}
function saveEditor(form){const fd=new FormData(form),g=(n)=>String(fd.get(n)||''),{kind,id}=modal;let old=kind==='todo'?d.todos.find(x=>x.id===id):kind==='routine'?d.routines.find(x=>x.id===id):kind==='event'?d.events.find(x=>x.id===id):kind==='memo'?d.memos.find(x=>x.id===id):d.categories.find(x=>x.id===id);const idOut=id||uid();if(kind==='category'){if(!g('name').trim())return alert('カテゴリ名を入力してください');if(d.categories.some(x=>x.name===g('name').trim()&&x.id!==idOut))return alert('同名のカテゴリが存在します');d.categories=[...d.categories.filter(x=>x.id!==idOut),{id:idOut,name:g('name').trim(),color:g('categoryColor')}];}

 if(['追加','add'].includes(verb)&&name){let date=opts.map(parseDate).find(Boolean)||'',time=opts.find(x=>/^\d\d:\d\d$/.test(x))||'23:59';d.todos.push({id:uid(),title:name,categoryId,notes:'',color:'',dueAt:date?date+'T'+time:'',priority:'normal',createdAt:isoNow(),completedAt:null});cmdMsg=`TODO「${name}」を登録しました`;persist();return;}
 if(['習慣追加','routine'].includes(verb)&&name){let x=opts.find(x=>x.startsWith('毎週:')||/^週\d+回$/.test(x)||/^月\d+回$/.test(x))||'',rule={type:'daily'};if(x.startsWith('毎週:')){const ds=x.slice(3).split(',').map(w=>weekdays.indexOf(w.replace('曜',''))).filter(x=>x>=0);rule=ds.length?{type:'weekday',weekdays:ds}:{type:'daily'}}if(/^週\d+回$/.test(x))rule={type:'quota',unit:'week',count:Number(x.slice(1,-1))};if(/^月\d+回$/.test(x))rule={type:'quota',unit:'month',count:Number(x.slice(1,-1))};d.routines.push({id:uid(),title:name,categoryId,notes:'',color:'',startDate:now,endDate:'',time:'',rule,createdAt:isoNow()});cmdMsg=`ルーチン「${name}」を登録しました`;persist();return;}
 if(['予定追加','event'].includes(verb)&&name){const date=opts.map(parseDate).find(Boolean)||now,time=opts.find(x=>/^\d\d:\d\d$/.test(x))||'10:00';d.events.push({id:uid(),title:name,categoryId,notes:'',color:'',startAt:date+'T'+time,endAt:'',location:'',url:'',createdAt:isoNow()});cmdMsg=`イベント「${name}」を登録しました`;persist();return;}
 if(['完了','done','取消','undo','削除','delete'].includes(verb)){const id=tail[0]||'',item=[...d.todos.map(x=>({...x,kind:'todo'})),...d.routines.map(x=>({...x,kind:'routine'}))].find(x=>id&&x.id.startsWith(id));if(!item)return notify('IDが見つかりません');if(['削除','delete'].includes(verb))return deleteItem(item.kind,item.id);if(item.kind==='todo'){if((verb==='完了'||verb==='done')&&!item.completedAt||(verb==='取消'||verb==='undo')&&item.completedAt)return checkTodo(item.id)}else{const checked=d.completions.some(x=>x.routineId===item.id&&x.date===now);if((verb==='完了'||verb==='done')&&!checked||(verb==='取消'||verb==='undo')&&checked)return checkRoutine(item.id)}return notify('すでに指定した状態です')}
 if(['表示','list'].includes(verb)){filter=categoryId;tab='todos';render();return}if(['help','?','ヘルプ'].includes(verb)){help=true;render();return}notify('コマンドを認識できません。「help」で例を確認できます。')}
function getRange(){return[range==='30'?addDays(now,-29):range==='month'?now.slice(0,7)+'-01':rangeStart,range==='custom'?rangeEnd:now]}
async function cloudFetch(path,method='GET',payload,prefer='',retry=true){if(!cloudConfig.url||!cloudConfig.key)throw Error('Supabase接続設定がありません');if(session&&session.expires_at&&Date.now()/1000>session.expires_at-60)await cloudRefresh();const head={'apikey':cloudConfig.key,'Content-Type':'application/json'};if(session?.access_token)head.Authorization='Bearer '+session.access_token;if(prefer)head.Prefer=prefer;let resp=await fetch(cloudConfig.url.replace(/\/$/,'')+path,{method,headers:head,body:payload?JSON.stringify(payload):undefined});if(resp.status===401&&retry&&session?.refresh_token){await cloudRefresh();return cloudFetch(path,method,payload,prefer,false)}let json=await resp.text(),result=json?JSON.parse(json):null;if(!resp.ok)throw Error(result?.msg||result?.message||result?.error_description||`HTTP ${resp.status}`);return result}
async function cloudRefresh(){if(!session?.refresh_token)return;const res=await fetch(cloudConfig.url.replace(/\/$/,'')+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':cloudConfig.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});let json=await res.json();if(!res.ok){cloudReady=false;session=null;localStorage.removeItem('pm-session');throw Error('再ログインしてください')}session={...json,expires_at:Math.floor(Date.now()/1000)+json.expires_in};localStorage.setItem('pm-session',JSON.stringify(session))}
async function cloudLogin(mode){const email=$('#auth-email')?.value,password=$('#auth-password')?.value;if(!email||!password)return alert('メールとパスワードを入力してください');try{cloudMessage='接続中…';const path=mode==='signup'?'/auth/v1/signup':'/auth/v1/token?grant_type=password';const result=await cloudFetch(path,'POST',{email,password});if(!result.access_token){cloudMessage='確認メールを送信しました。受信箱を確認し、ログインしてください。';render();return}session={...result,expires_at:Math.floor(Date.now()/1000)+result.expires_in};localStorage.setItem('pm-session',JSON.stringify(session));await cloudRead(false)}catch(e){cloudMessage='認証エラー: '+e.message;render()}}
async function cloudRead(force){if(!session)return;try{cloudMessage='クラウドデータ読込中…';render();const rows=await cloudFetch(`/rest/v1/app_state?select=data&user_id=eq.${encodeURIComponent(session.user.id)}`);const remote=rows?.[0]?.data;
 if(remote&&isDataState(remote)){
  if(force){if(!confirm('クラウドのデータで、この端末のデータを置き換えますか？'))return;d=remote;localStorage.setItem('personal-manager-v1',JSON.stringify(d));cloudChoice=null;cloudReady=true;cloudMessage='同期済み';render();return;}
  if((d.todos.length||d.routines.length||d.memos.length||d.events.length||d.completions.length)&&JSON.stringify(remote)!==JSON.stringify(d)){cloudChoice=remote;cloudReady=false;cloudMessage='同期するデータを選択してください';}
  else{d=remote;localStorage.setItem('personal-manager-v1',JSON.stringify(d));cloudChoice=null;cloudReady=true;cloudMessage='同期済み';}
 }else{cloudChoice=null;cloudReady=true;cloudMessage='同期を開始しました';await cloudWrite()}
 render();
 }catch(e){cloudReady=false;cloudMessage='読込エラー: '+e.message;render()}}
async function cloudWrite(){if(!cloudReady||!session)return;try{cloudMessage='保存中…';await cloudFetch('/rest/v1/app_state?on_conflict=user_id','POST',{user_id:session.user.id,data:d,updated_at:isoNow()},'resolution=merge-duplicates');cloudMessage='同期済み';}catch(e){cloudMessage='同期エラー: '+e.message}let el=$('#cloud-message');if(el)el.textContent=cloudMessage;}
function action(a,el){let id=el.dataset.id,kind=el.dataset.kind;
 switch(a){
 case 'nav':tab=el.dataset.tab;menu=false;filter='all';status='open';query='';render();break;
 case 'menu':menu=!menu;render();break;
 case 'add':modal={kind,date:el.dataset.date||''};render();break;
 case 'edit':modal={kind,id};render();break;
 case 'close-modal':modal=null;render();break;
 case 'modal-backdrop':modal=null;render();break;
 case 'check-todo':checkTodo(id);break;
 case 'check-routine':checkRoutine(id);break;
 case 'delete':deleteItem(kind,id);break;
 case 'ev-view':evView=el.dataset.view;render();break;
 case 'month-prev':shiftMonth(-1);break;case 'month-next':shiftMonth(1);break;case 'month-now':calMonth=now.slice(0,7);render();break;
 case 'theme':theme=theme==='light'?'dark':'light';document.documentElement.dataset.theme=theme;localStorage.setItem('pm-theme',theme);render();break;
 case 'range':range=el.dataset.range;render();break;
 case 'export-stats':{let [s,e]=getRange();exportStats({...d,routines:d.routines.filter(belongs)},s,e);break;}
 case 'export-history':{let [s,e]=getRange();exportHistory({...d,routines:d.routines.filter(belongs),todos:d.todos.filter(belongs)},s,e);break;}
 case 'backup':downloadFile('personal-manager-backup-'+now+'.json',JSON.stringify(d,null,2),'application/json');break;
 case 'pick-color':{const input=root.querySelector('input[name="categoryColor"]');if(input)input.value=el.dataset.color;break;}
 case 'help':help=!help;render();break;
 case 'cloud-config':{
  const url=$('#cloud-url').value.trim(),key=$('#cloud-key').value.trim();if(url&&!/^https:\/\/[^/]+/.test(url))return alert('https://から始まるURLを入力してください');cloudConfig={url,key};localStorage.setItem('pm-cloud-config',JSON.stringify(cloudConfig));cloudMessage='設定を保存しました';cloudReady=false;session=null;cloudChoice=null;localStorage.removeItem('pm-session');render();break;}
 case 'cloud-signin':cloudLogin('signin');break;case 'cloud-signup':cloudLogin('signup');break;
 case 'cloud-use-remote':{d=cloudChoice;cloudChoice=null;cloudReady=true;localStorage.setItem('personal-manager-v1',JSON.stringify(d));cloudMessage='同期を開始しました';render();break;}
 case 'cloud-use-local':{cloudChoice=null;cloudReady=true;cloudMessage='同期を開始しました';render();cloudWrite();break;}
 case 'cloud-refresh':cloudRead(true);break;
 case 'cloud-logout':{session=null;cloudReady=false;cloudChoice=null;localStorage.removeItem('pm-session');cloudMessage='ログアウトしました';render();break;}
 }
}
root.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;if(el.dataset.action==='modal-backdrop'&&el!==e.target)return;action(el.dataset.action,el)});
root.addEventListener('submit',e=>{if(e.target.id==='editor-form'){e.preventDefault();saveEditor(e.target)}else if(e.target.id==='command-form'){e.preventDefault();const inp=$('#command-input');let text=inp.value;runCommand(text)}});
root.addEventListener('change',async e=>{const t=e.target;if(t.id==='cat-filter'){filter=t.value;render()}if(t.id==='status-filter'){status=t.value;render()}if(t.id==='rule-type')ruleOptions();if(t.id==='range-start'){rangeStart=t.value;render()}if(t.id==='range-end'){rangeEnd=t.value;render()}if(t.id==='restore-file'){
 const file=t.files?.[0];if(!file)return;try{const x=JSON.parse(await file.text());if(!isDataState(x))throw Error('不正な形式です');if(confirm('今のデータをJSONの内容で置き換えますか？')){d=x;persist();notify('復元しました')}}catch(err){alert('読み込み失敗: '+err.message)}t.value='';}
});
root.addEventListener('input',e=>{if(e.target.name==='colorValue'){const check=root.querySelector('input[name=colorOverride]');if(check)check.checked=true;}if(e.target.id==='search'){const v=e.target.value,pos=e.target.selectionStart;query=v;render();let x=$('#search');x?.focus();x?.setSelectionRange(pos,pos)}});
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#command-input')?.focus()}if(e.key==='Escape'&&modal){modal=null;render()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&dateStr()!==now){now=dateStr();calMonth=now.slice(0,7);render()}});
render();if(session&&cloudConfig.url&&cloudConfig.key)cloudRead(false);

</script></body></html>
